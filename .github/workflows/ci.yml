name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run standard validation
        run: npm run validate

      - name: Run Gesture calibration E2E
        run: npm run test:e2e:gesture-calibration

      - name: Run scroll reset E2E
        run: npx playwright test tests/e2e/scroll-reset.spec.ts

      - name: Run Admin E2E
        run: npm run test:e2e:admin

      - name: Run admin visual regression E2E
        run: npm run test:e2e:visual

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
