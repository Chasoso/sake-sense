name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
      data_admin: ${{ steps.paths.outputs.data_admin }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed deployment paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            frontend=true
            backend=true
            data_admin=true
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            frontend=false
            backend=false
            data_admin=false
            if printf '%s\n' "$changed_files" | grep -Eq '^(src/|public/|index.html|package.json|package-lock.json|\.nvmrc$|vite\.config\.[^/]+$|tsconfig[^/]*\.json$)'; then
              frontend=true
            fi
            if printf '%s\n' "$changed_files" | grep -Eq '^(backend/semantic-bridge/|infra/aws/ai-semantic-bridge\.yaml$|scripts/package-semantic-bridge\.mjs$|package.json|package-lock.json|\.nvmrc$)'; then
              backend=true
            fi
            if printf '%s\n' "$changed_files" | grep -Eq '^(backend/data-platform/|infra/aws/data-admin\.yaml$|infra/aws/data-admin-bootstrap\.yaml$|scripts/package-data-platform\.mjs$|scripts/check-cloudformation-change-set\.mjs$|scripts/quality/validate-data-admin\.mjs|\.github/workflows/deploy-data-admin\.yml$|package\.json|package-lock\.json|\.nvmrc$)'; then
              data_admin=true
            fi
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "data_admin=$data_admin" >> "$GITHUB_OUTPUT"

  deploy-data-admin:
    name: Deploy data-admin infrastructure
    needs: changes
    if: needs.changes.outputs.data_admin == 'true'
    uses: ./.github/workflows/deploy-data-admin.yml
    secrets: inherit

  deploy-frontend:
    name: Build and deploy frontend
    needs: [changes, deploy-data-admin]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.frontend == 'true' &&
      (needs.changes.outputs.data_admin != 'true' || needs.deploy-data-admin.result == 'success')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_SENSORY_BRIDGE_API_URL: ${{ vars.VITE_SENSORY_BRIDGE_API_URL }}
      VITE_SAKE_DATA_API_BASE_URL: ${{ vars.VITE_SAKE_DATA_API_BASE_URL }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
      VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
      VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build production frontend
        run: npm run build

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for variable in AWS_REGION AWS_ROLE_ARN S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID VITE_SENSORY_BRIDGE_API_URL VITE_SAKE_DATA_API_BASE_URL VITE_COGNITO_DOMAIN VITE_COGNITO_CLIENT_ID VITE_COGNITO_REDIRECT_URI VITE_COGNITO_LOGOUT_URI; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub production variable: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sake-sense-production

      - name: Upload generated frontend assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --exclude index.html \
            --exclude manifest.webmanifest \
            --exclude "favicon-*.png" \
            --exclude apple-touch-icon.png \
            --exclude "icons/*" \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload fixed PWA assets without immutable cache
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --exclude "*" \
            --include manifest.webmanifest \
            --include "favicon-*.png" \
            --include apple-touch-icon.png \
            --include "icons/*" \
            --cache-control "public,max-age=300"

      - name: Upload entrypoint without long cache
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

  deploy-semantic-bridge:
    name: Package and deploy semantic bridge stack
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SEMANTIC_BRIDGE_STACK_NAME: ${{ vars.SEMANTIC_BRIDGE_STACK_NAME }}
      SEMANTIC_BRIDGE_ARTIFACT_BUCKET: ${{ vars.SEMANTIC_BRIDGE_ARTIFACT_BUCKET }}
      SEMANTIC_BRIDGE_ALLOWED_ORIGIN: ${{ vars.SEMANTIC_BRIDGE_ALLOWED_ORIGIN }}
      SEMANTIC_BRIDGE_MODEL_ID: ${{ vars.SEMANTIC_BRIDGE_MODEL_ID }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build semantic bridge bundle
        run: npm run build:semantic-bridge

      - name: Package semantic bridge Lambda
        run: npm run package:semantic-bridge

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for variable in AWS_REGION AWS_ROLE_ARN SEMANTIC_BRIDGE_STACK_NAME SEMANTIC_BRIDGE_ARTIFACT_BUCKET SEMANTIC_BRIDGE_ALLOWED_ORIGIN SEMANTIC_BRIDGE_MODEL_ID CLOUDFORMATION_EXECUTION_ROLE_ARN; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub production variable: ${variable}" >&2
              exit 1
            fi
          done
          case "${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" in
            https://*) ;;
            *) echo "SEMANTIC_BRIDGE_ALLOWED_ORIGIN must be an https origin" >&2; exit 1 ;;
          esac
          if [[ "${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" == */ ]]; then
            echo "SEMANTIC_BRIDGE_ALLOWED_ORIGIN must not have a trailing slash" >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sake-sense-production

      - name: Upload immutable Lambda artifact
        run: |
          set -euo pipefail
          artifact_key="semantic-bridge/${GITHUB_SHA}.zip"
          echo "ARTIFACT_KEY=${artifact_key}" >> "$GITHUB_ENV"
          aws s3 cp backend/semantic-bridge/dist/index.js.zip \
            "s3://${SEMANTIC_BRIDGE_ARTIFACT_BUCKET}/${artifact_key}" \
            --only-show-errors

      - name: Deploy semantic bridge CloudFormation stack
        run: |
          set -euo pipefail
          change_set_name="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          change_set_file="${RUNNER_TEMP}/semantic-bridge-change-set-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          change_set_id=""
          cleanup_change_set() {
            if [ -n "$change_set_id" ]; then
              aws cloudformation delete-change-set \
                --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
                --change-set-name "$change_set_id" \
                --region "${AWS_REGION}" \
                >/dev/null 2>&1 || true
            fi
          }
          trap cleanup_change_set EXIT

          create_output="$(aws cloudformation create-change-set \
            --template-body file://infra/aws/ai-semantic-bridge.yaml \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --change-set-name "$change_set_name" \
            --change-set-type UPDATE \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${CLOUDFORMATION_EXECUTION_ROLE_ARN}" \
            --parameters \
              ParameterKey=AllowedOrigin,ParameterValue="${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" \
              ParameterKey=BedrockModelId,ParameterValue="${SEMANTIC_BRIDGE_MODEL_ID}" \
              ParameterKey=LambdaCodeS3Bucket,ParameterValue="${SEMANTIC_BRIDGE_ARTIFACT_BUCKET}" \
              ParameterKey=LambdaCodeS3Key,ParameterValue="${ARTIFACT_KEY}" \
            --region "${AWS_REGION}" \
            --query '{Id:Id}' \
            --output json)"
          change_set_id="$(printf '%s' "$create_output" | jq -r '.Id // empty')"
          if [ -z "$change_set_id" ]; then
            echo "CloudFormation change set creation returned no identifier" >&2
            exit 1
          fi

          wait_status=0
          aws cloudformation wait change-set-create-complete \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --change-set-name "$change_set_id" \
            --region "${AWS_REGION}" || wait_status=$?
          if ! aws cloudformation describe-change-set \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --change-set-name "$change_set_id" \
            --region "${AWS_REGION}" \
            --output json > "$change_set_file"; then
            echo "Unable to inspect CloudFormation change set" >&2
            exit 1
          fi

          set +e
          gate_output="$(node scripts/check-cloudformation-change-set.mjs "$change_set_file")"
          gate_status=$?
          set -e
          printf '%s\n' "$gate_output"
          if [ "$gate_status" -eq 2 ]; then
            echo "CloudFormation reported no changes; deployment is a successful no-op."
            exit 0
          fi
          if [ "$wait_status" -ne 0 ] || [ "$gate_status" -ne 0 ]; then
            echo "CloudFormation change set was not safe to execute. Human review required; the change set was not executed." >&2
            exit 1
          fi

          aws cloudformation execute-change-set \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --change-set-name "$change_set_id" \
            --region "${AWS_REGION}"
          change_set_id=""
          wait_status=0
          aws cloudformation wait stack-update-complete \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --region "${AWS_REGION}" || wait_status=$?
          if [ "$wait_status" -ne 0 ]; then
            echo "CloudFormation stack update failed. Relevant failed stack events:" >&2
            aws cloudformation describe-stack-events \
              --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
              --region "${AWS_REGION}" \
              --query 'StackEvents[?ResourceStatus==`UPDATE_FAILED` || ResourceStatus==`CREATE_FAILED` || ResourceStatus==`DELETE_FAILED` || ResourceStatus==`UPDATE_ROLLBACK_FAILED` || ResourceStatus==`ROLLBACK_FAILED`] | [0:10].{Timestamp:Timestamp,LogicalResourceId:LogicalResourceId,ResourceType:ResourceType,ResourceStatus:ResourceStatus,ResourceStatusReason:ResourceStatusReason}' \
              --output table >&2 || echo "Unable to retrieve failed CloudFormation stack events" >&2
            exit "$wait_status"
          fi

      - name: Verify semantic bridge stack and Lambda
        run: |
          set -euo pipefail
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          if [ "$stack_status" != "CREATE_COMPLETE" ] && [ "$stack_status" != "UPDATE_COMPLETE" ]; then
            echo "CloudFormation stack verification failed: ${stack_status}" >&2
            exit 1
          fi
          function_name="$(aws cloudformation describe-stack-resources \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --logical-resource-id SemanticBridgeFunction \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)"
          function_status="$(aws lambda get-function-configuration \
            --function-name "$function_name" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,MemorySize:MemorySize,Timeout:Timeout,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' \
            --output json)"
          if ! printf '%s' "$function_status" | jq -e '(.LastUpdateStatus == "Successful") and (.Runtime == "nodejs24.x") and (.MemorySize == 256) and (.Timeout == 30)' >/dev/null; then
            echo "Lambda verification failed" >&2
            exit 1
          fi
          api_endpoint="$(aws cloudformation describe-stacks \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`SemanticBridgeApiEndpoint`].OutputValue | [0]' \
            --output text)"
          if [ -z "$api_endpoint" ] || [ "$api_endpoint" = "None" ]; then
            echo "SemanticBridgeApiEndpoint output is missing" >&2
            exit 1
          fi
          echo "Semantic bridge deployment successful"
          echo "StackStatus: ${stack_status}"
          echo "SemanticBridgeApiEndpoint: ${api_endpoint}"
          printf '%s\n' "$function_status"
