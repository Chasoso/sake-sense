name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  changes:
    name: Detect deployment changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.paths.outputs.frontend }}
      backend: ${{ steps.paths.outputs.backend }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Detect changed deployment paths
        id: paths
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            frontend=true
            backend=true
          else
            changed_files="$(git diff --name-only "$BEFORE_SHA" "$AFTER_SHA")"
            frontend=false
            backend=false
            if printf '%s\n' "$changed_files" | grep -Eq '^(src/|public/|index.html|package.json|package-lock.json|\.nvmrc$|vite\.config\.[^/]+$|tsconfig[^/]*\.json$)'; then
              frontend=true
            fi
            if printf '%s\n' "$changed_files" | grep -Eq '^(backend/semantic-bridge/|infra/aws/ai-semantic-bridge\.yaml$|scripts/package-semantic-bridge\.mjs$|package.json|package-lock.json|\.nvmrc$)'; then
              backend=true
            fi
          fi
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"

  deploy-frontend:
    name: Build and deploy frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      S3_BUCKET_NAME: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
      VITE_SENSORY_BRIDGE_API_URL: ${{ vars.VITE_SENSORY_BRIDGE_API_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build production frontend
        run: npm run build

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for variable in AWS_REGION AWS_ROLE_ARN S3_BUCKET_NAME CLOUDFRONT_DISTRIBUTION_ID VITE_SENSORY_BRIDGE_API_URL; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub production variable: ${variable}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sake-sense-production

      - name: Upload hashed assets
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET_NAME}/" \
            --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"

      - name: Upload entrypoint without long cache
        run: |
          aws s3 cp dist/index.html "s3://${S3_BUCKET_NAME}/index.html" \
            --cache-control "no-cache,no-store,must-revalidate" \
            --content-type "text/html; charset=utf-8"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" --paths "/*"

  deploy-semantic-bridge:
    name: Package and deploy semantic bridge stack
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      SEMANTIC_BRIDGE_STACK_NAME: ${{ vars.SEMANTIC_BRIDGE_STACK_NAME }}
      SEMANTIC_BRIDGE_ARTIFACT_BUCKET: ${{ vars.SEMANTIC_BRIDGE_ARTIFACT_BUCKET }}
      SEMANTIC_BRIDGE_ALLOWED_ORIGIN: ${{ vars.SEMANTIC_BRIDGE_ALLOWED_ORIGIN }}
      SEMANTIC_BRIDGE_MODEL_ID: ${{ vars.SEMANTIC_BRIDGE_MODEL_ID }}
      CLOUDFORMATION_EXECUTION_ROLE_ARN: ${{ vars.CLOUDFORMATION_EXECUTION_ROLE_ARN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate repository
        run: npm run validate

      - name: Build semantic bridge bundle
        run: npm run build:semantic-bridge

      - name: Package semantic bridge Lambda
        run: npm run package:semantic-bridge

      - name: Check deployment configuration
        run: |
          set -euo pipefail
          for variable in AWS_REGION AWS_ROLE_ARN SEMANTIC_BRIDGE_STACK_NAME SEMANTIC_BRIDGE_ARTIFACT_BUCKET SEMANTIC_BRIDGE_ALLOWED_ORIGIN SEMANTIC_BRIDGE_MODEL_ID CLOUDFORMATION_EXECUTION_ROLE_ARN; do
            if [ -z "${!variable}" ]; then
              echo "Missing GitHub production variable: ${variable}" >&2
              exit 1
            fi
          done
          case "${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" in
            https://*) ;;
            *) echo "SEMANTIC_BRIDGE_ALLOWED_ORIGIN must be an https origin" >&2; exit 1 ;;
          esac
          if [[ "${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" == */ ]]; then
            echo "SEMANTIC_BRIDGE_ALLOWED_ORIGIN must not have a trailing slash" >&2
            exit 1
          fi

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          role-session-name: sake-sense-production

      - name: Upload immutable Lambda artifact
        run: |
          set -euo pipefail
          artifact_key="semantic-bridge/${GITHUB_SHA}.zip"
          echo "ARTIFACT_KEY=${artifact_key}" >> "$GITHUB_ENV"
          aws s3 cp backend/semantic-bridge/dist/index.js.zip \
            "s3://${SEMANTIC_BRIDGE_ARTIFACT_BUCKET}/${artifact_key}" \
            --only-show-errors

      - name: Deploy semantic bridge CloudFormation stack
        run: |
          set -euo pipefail
          if ! aws cloudformation deploy \
            --template-file infra/aws/ai-semantic-bridge.yaml \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --role-arn "${CLOUDFORMATION_EXECUTION_ROLE_ARN}" \
            --parameter-overrides \
              AllowedOrigin="${SEMANTIC_BRIDGE_ALLOWED_ORIGIN}" \
              BedrockModelId="${SEMANTIC_BRIDGE_MODEL_ID}" \
              LambdaCodeS3Bucket="${SEMANTIC_BRIDGE_ARTIFACT_BUCKET}" \
              LambdaCodeS3Key="${ARTIFACT_KEY}" \
            --region "${AWS_REGION}"; then
            echo "CloudFormation deployment failed. Recent stack events:" >&2
            if ! aws cloudformation describe-stack-events \
              --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
              --query 'StackEvents[0:5].{LogicalResourceId:LogicalResourceId,ResourceStatus:ResourceStatus,ResourceStatusReason:ResourceStatusReason}' \
              --output table >&2; then
              echo "Unable to read recent stack events" >&2
            fi
            exit 1
          fi

      - name: Verify semantic bridge stack and Lambda
        run: |
          set -euo pipefail
          stack_status="$(aws cloudformation describe-stacks \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --query 'Stacks[0].StackStatus' \
            --output text)"
          if [ "$stack_status" != "CREATE_COMPLETE" ] && [ "$stack_status" != "UPDATE_COMPLETE" ]; then
            echo "CloudFormation stack verification failed: ${stack_status}" >&2
            exit 1
          fi
          function_name="$(aws cloudformation describe-stack-resources \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --logical-resource-id SemanticBridgeFunction \
            --query 'StackResources[0].PhysicalResourceId' \
            --output text)"
          function_status="$(aws lambda get-function-configuration \
            --function-name "$function_name" \
            --query '{FunctionName:FunctionName,Runtime:Runtime,MemorySize:MemorySize,Timeout:Timeout,LastUpdateStatus:LastUpdateStatus,LastModified:LastModified}' \
            --output json)"
          if ! printf '%s' "$function_status" | jq -e '(.LastUpdateStatus == "Successful") and (.Runtime == "nodejs24.x") and (.MemorySize == 256) and (.Timeout == 30)' >/dev/null; then
            echo "Lambda verification failed" >&2
            exit 1
          fi
          api_endpoint="$(aws cloudformation describe-stacks \
            --stack-name "${SEMANTIC_BRIDGE_STACK_NAME}" \
            --query 'Stacks[0].Outputs[?OutputKey==`SemanticBridgeApiEndpoint`].OutputValue | [0]' \
            --output text)"
          if [ -z "$api_endpoint" ] || [ "$api_endpoint" = "None" ]; then
            echo "SemanticBridgeApiEndpoint output is missing" >&2
            exit 1
          fi
          echo "Semantic bridge deployment successful"
          echo "StackStatus: ${stack_status}"
          echo "SemanticBridgeApiEndpoint: ${api_endpoint}"
          printf '%s\n' "$function_status"
