AWSTemplateFormatVersion: "2010-09-09"
Description: Private S3 and CloudFront static hosting foundation for Sake Sense.

Parameters:
  GitHubOwner:
    Type: String
    Default: Chasoso
    Description: GitHub owner name used in the immutable OIDC subject.
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  GitHubRepositoryName:
    Type: String
    Default: sake-sense
    Description: GitHub repository name used in the immutable OIDC subject.
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  GitHubOwnerId:
    Type: String
    Description: Immutable GitHub owner ID used in the OIDC subject.
    AllowedPattern: "^[0-9]+$"
  GitHubRepositoryId:
    Type: String
    Description: Immutable GitHub repository ID used in the OIDC subject.
    AllowedPattern: "^[0-9]+$"
  GitHubEnvironmentName:
    Type: String
    Default: production
    Description: GitHub Environment used by the production deployment workflow.
    AllowedPattern: "^[A-Za-z0-9_.-]+$"
  SemanticBridgeFunctionName:
    Type: String
    Default: sake-sense-ai-production-handler
    Description: Semantic bridge Lambda function managed by the production stack.
    AllowedPattern: "^[A-Za-z0-9_-]+$"
  SemanticBridgeStackName:
    Type: String
    Default: sake-sense-ai-production
    Description: Existing semantic bridge CloudFormation stack name.
    AllowedPattern: "^[A-Za-z][A-Za-z0-9-]*$"
  GitHubOidcProviderArn:
    Type: String
    Description: Existing IAM OIDC provider ARN for https://token.actions.githubusercontent.com.
    AllowedPattern: "^arn:[^:]+:iam::[0-9]{12}:oidc-provider/token\\.actions\\.githubusercontent\\.com$"

Resources:
  WebsiteBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  SemanticBridgeArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled

  CloudFrontOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Description: Access control for the private Sake Sense website bucket.
        Name: !Sub ${AWS::StackName}-s3-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Sake Sense production frontend
        DefaultRootObject: index.html
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - DomainName: !GetAtt WebsiteBucket.RegionalDomainName
            Id: S3Origin
            OriginAccessControlId: !GetAtt CloudFrontOriginAccessControl.Id
            S3OriginConfig: {}
        DefaultCacheBehavior:
          AllowedMethods:
            - GET
            - HEAD
          CachedMethods:
            - GET
            - HEAD
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          Compress: true
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
        CacheBehaviors:
          - PathPattern: /index.html
            AllowedMethods:
              - GET
              - HEAD
            CachedMethods:
              - GET
              - HEAD
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            Compress: true
            TargetOriginId: S3Origin
            ViewerProtocolPolicy: redirect-to-https
        CustomErrorResponses:
          - ErrorCode: 403
            ErrorCachingMinTTL: 0
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ErrorCachingMinTTL: 0
            ResponseCode: 200
            ResponsePagePath: /index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  WebsiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebsiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowCloudFrontReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebsiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  GitHubDeploymentRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Least-privilege frontend deployment role for Sake Sense.
      RoleName: !Sub ${AWS::StackName}-github-deploy
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubOwner}@${GitHubOwnerId}/${GitHubRepositoryName}@${GitHubRepositoryId}:environment:${GitHubEnvironmentName}
      Policies:
        - PolicyName: FrontendDeployment
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListWebsiteBucket
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt WebsiteBucket.Arn
              - Sid: ManageWebsiteObjects
                Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${WebsiteBucket.Arn}/*
              - Sid: InvalidateDistribution
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}
              - Sid: ListSemanticBridgeArtifacts
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SemanticBridgeArtifactBucket.Arn
              - Sid: UploadSemanticBridgeArtifacts
                Effect: Allow
                Action: s3:PutObject
                Resource: !Sub ${SemanticBridgeArtifactBucket.Arn}/semantic-bridge/*
              - Sid: CreateSemanticBridgeChangeSet
                Effect: Allow
                Action: cloudformation:CreateChangeSet
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SemanticBridgeStackName}/*
                Condition:
                  StringEquals:
                    cloudformation:RoleArn: !GetAtt SemanticBridgeCloudFormationExecutionRole.Arn
              - Sid: ManageSemanticBridgeChangeSets
                Effect: Allow
                Action:
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                Resource:
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:changeSet/*/*
                  - !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SemanticBridgeStackName}/*
              - Sid: ReadSemanticBridgeStack
                Effect: Allow
                Action:
                  - cloudformation:DescribeStackEvents
                  - cloudformation:DescribeStackResources
                  - cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${SemanticBridgeStackName}/*
              - Sid: SummarizeSemanticBridgeTemplate
                Effect: Allow
                Action: cloudformation:GetTemplateSummary
                Resource: "*"
              - Sid: PassSemanticBridgeCloudFormationRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt SemanticBridgeCloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  SemanticBridgeCloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-semantic-bridge-cfn
      Description: Restricted CloudFormation execution role for the semantic bridge stack.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudformation.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SemanticBridgeStackResources
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadSemanticBridgeArtifacts
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                Resource: !Sub ${SemanticBridgeArtifactBucket.Arn}/semantic-bridge/*
              - Sid: ManageSemanticBridgeLambda
                Effect: Allow
                Action:
                  - lambda:AddPermission
                  - lambda:CreateFunction
                  - lambda:DeleteFunction
                  - lambda:GetFunction
                  - lambda:GetFunctionConfiguration
                  - lambda:GetPolicy
                  - lambda:ListTags
                  - lambda:RemovePermission
                  - lambda:TagResource
                  - lambda:UntagResource
                  - lambda:UpdateFunctionCode
                  - lambda:UpdateFunctionConfiguration
                Resource: !Sub arn:${AWS::Partition}:lambda:${AWS::Region}:${AWS::AccountId}:function:${SemanticBridgeFunctionName}
              - Sid: ManageSemanticBridgeApi
                Effect: Allow
                Action:
                  - apigateway:DELETE
                  - apigateway:GET
                  - apigateway:PATCH
                  - apigateway:POST
                  - apigateway:PUT
                Resource: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/apis/*
              - Sid: ManageSemanticBridgeRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:DeleteRolePolicy
                  - iam:GetRole
                  - iam:ListRolePolicies
                  - iam:PutRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:UpdateAssumeRolePolicy
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${SemanticBridgeStackName}-*
              - Sid: PassSemanticBridgeRuntimeRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${SemanticBridgeStackName}-*
                Condition:
                  StringEquals:
                    iam:PassedToService: lambda.amazonaws.com

Outputs:
  CloudFrontDistributionId:
    Description: CloudFront distribution ID for invalidation.
    Value: !Ref CloudFrontDistribution
  CloudFrontDomainName:
    Description: CloudFront HTTPS domain for the production frontend.
    Value: !GetAtt CloudFrontDistribution.DomainName
  DeploymentRoleArn:
    Description: IAM role ARN to configure as the GitHub production variable AWS_ROLE_ARN.
    Value: !GetAtt GitHubDeploymentRole.Arn
  WebsiteBucketName:
    Description: Private S3 bucket name for frontend artifacts.
    Value: !Ref WebsiteBucket
  SemanticBridgeArtifactBucketName:
    Description: Private versioned bucket name for immutable semantic bridge Lambda artifacts.
    Value: !Ref SemanticBridgeArtifactBucket
  SemanticBridgeCloudFormationExecutionRoleArn:
    Description: Dedicated CloudFormation execution role for the semantic bridge stack.
    Value: !GetAtt SemanticBridgeCloudFormationExecutionRole.Arn
